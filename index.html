function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function posterSVG(e,wide=false){const colors={raas:['#4b0909','#e5bd6a','#f7e3ae'],sufi:['#170a31','#7d3f9e','#e2b879'],social:['#05231e','#236a58','#d7b56b'],midnight:['#061020','#3d2d91','#9b7bff'],rang:['#54103e','#d94b2c','#ffd66e']}[e.theme];let title=e.short.replace(/ — /g,'\n— ');let lines=title.split('\n');let circles=e.theme==='raas'?'☾':e.theme==='sufi'?'✦':e.theme==='social'?'◌':e.theme==='midnight'?'◈':'✺';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${wide?1200:800} ${wide?520:1000}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${colors[0]}"/><stop offset=".55" stop-color="${colors[1]}"/><stop offset="1" stop-color="${colors[2]}"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="#080808"/><rect x="18" y="18" width="${wide?1164:764}" height="${wide?484:964}" rx="28" fill="url(#g)"/><circle cx="${wide?900:600}" cy="${wide?180:260}" r="${wide?150:220}" fill="url(#r)"/><g fill="none" stroke="#fff" stroke-opacity=".18"><circle cx="${wide?900:600}" cy="${wide?180:260}" r="${wide?185:270}"/><circle cx="${wide?900:600}" cy="${wide?180:260}" r="${wide?225:330}"/><circle cx="${wide?900:600}" cy="${wide?180:260}" r="${wide?275:390}"/></g><text x="${wide?70:60}" y="${wide?76:92}" fill="#fff" font-family="Arial" font-size="${wide?22:22}" letter-spacing="5">WEKND.SPIRIT</text><text x="${wide?70:60}" y="${wide?116:130}" fill="#fff" fill-opacity=".78" font-family="Arial" font-size="12" letter-spacing="3">${e.tag}</text><text x="${wide?70:60}" y="${wide?350:620}" fill="#fff" font-family="Georgia" font-weight="700" font-size="${wide?54:55}">${lines.map((l,i)=>`<tspan x="${wide?70:60}" dy="${i?60:0}">${esc(l)}</tspan>`).join('')}</text><text x="${wide?70:60}" y="${wide?450:820}" fill="#fff" fill-opacity=".8" font-family="Arial" font-size="14" letter-spacing="3">${e.date.toUpperCase()}  •  ${e.city.toUpperCase()}</text><text x="${wide?1030:650}" y="${wide?445:885}" fill="#fff" font-family="Georgia" font-size="${wide?75:95}" opacity=".8">${circles}</text></svg>`}
function posterData(e,wide=false){const real={raas:'assets/posters/raas.jpg',sufi:'assets/posters/sufi.jpg',midnight:'assets/posters/midnight.jpg'};const wideReal={raas:'assets/posters/raas-wide.jpg',sufi:'assets/posters/sufi-wide.jpg',midnight:'assets/posters/midnight-wide.jpg'};return (wide?wideReal[e.id]:real[e.id]) || ('assets/posters/'+e.id+(wide?'-wide':'')+'.svg')}

function header(){return `<header class="top"><button class="iconBtn" onclick="home()" aria-label="Home">⌂</button><img class="brandImg" src="assets/ws-logo-tight.png" alt="WEKND.SPIRIT"><div class="topActions"><button class="iconBtn" onclick="openSearch()">⌕</button><button class="iconBtn avatar" onclick="openAccount()">${state.profile?.photo?`<img src="${state.profile.photo}">`:'<span class="avatarText">YP</span>'}</button></div></header>`}
function renderHome(){document.getElementById('app').innerHTML=header()+`<main class="wrap"><div class="heroHead"><div><div class="eyebrow">EVENTS</div><h1>${state.city}</h1><p class="sub">Curated. Premium. Unforgettable.</p></div><div class="heroActions"><button class="chip" onclick="state.city=null;renderGate()">⌄ Change city</button></div></div><h2 class="sectionTitle">Featured events</h2><div class="featured">${events.slice(0,3).map(e=>`<article class="feature" onclick="openDetails('${e.id}')"><div class="featureBanner banner ${e.theme}"><img class="art" src="${posterData(e,true)}" alt="${esc(e.title)} poster"><button class="featureSave" onclick="event.stopPropagation();toggleSave('${e.id}',this)">${state.saved.includes(e.id)?'♥':'♡'}</button></div><div class="featureInfo"><b>${e.venue}</b><small>${e.date} · ${e.time} · ${e.city}</small><small>${e.desc}</small></div></article>`).join('')}</div><h2 class="sectionTitle">Top experiences</h2><div class="featured">${events.slice(0,4).map(e=>`<article class="feature" onclick="openDetails('${e.id}')"><div class="featureBanner banner ${e.theme}"><img class="art" src="${posterData(e,true)}" alt="${esc(e.title)} poster"><button class="featureSave" onclick="event.stopPropagation();toggleSave('${e.id}',this)">${state.saved.includes(e.id)?'♥':'♡'}</button></div><div class="featureInfo"><b>${e.date}</b><small>${e.city} · from ${money(e.price)}</small><small>${e.offer}</small></div></article>`).join('')}</div><div class="gridHead"><h2 class="sectionTitle" style="margin-bottom:0">All events</h2><select class="sortSelect" onchange="sortEvents(this.value)"><option value="relevance">Sort by · Relevance</option><option value="date">Date</option><option value="price">Price</option><option value="name">Name</option></select></div><div class="filters"><button class="filter active" onclick="filterEvents('all',this)">All</button><button class="filter" onclick="filterEvents('today',this)">Today</button><button class="filter" onclick="filterEvents('tomorrow',this)">Tomorrow</button><button class="filter" onclick="filterEvents('weekend',this)">This weekend</button><button class="filter" onclick="filterEvents('music',this)">Music</button><button class="filter" onclick="filterEvents('culture',this)">Culture</button><button class="filter" onclick="filterEvents('nightlife',this)">Nightlife</button></div><div id="eventsGrid" class="eventsGrid">${eventCards(events)}</div></main><nav class="bottomNav"><div><button class="active" onclick="home()">✦<br><small>Events</small></button><button onclick="openSearch()">⌕<br><small>Search</small></button></div></nav>`}
function eventCards(list){return list.map(e=>`<article class="eventCard"><div class="poster"><img src="${posterData(e)}" alt="${esc(e.title)} poster"><button class="save" onclick="event.stopPropagation();toggleSave('${e.id}',this)">${state.saved.includes(e.id)?'♥':'♡'}</button></div><div class="eventBody" onclick="openDetails('${e.id}')"><div class="locline">⌖ ${e.venue}</div><h3>${e.title}</h3><div class="date">${e.date} · ${e.time}</div><div class="offer">◆ ${e.offer}</div></div></article>`).join('')}
function filterEvents(kind,btn){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let list=[...events];const now=new Date('2026-09-12T12:00:00');const day=new Date(now);if(kind==='today')list=list.filter(e=>new Date(e.date+' 23:59:59').toDateString()===day.toDateString());if(kind==='tomorrow'){const d=new Date(day);d.setDate(d.getDate()+1);list=list.filter(e=>new Date(e.date+' 23:59:59').toDateString()===d.toDateString())}if(kind==='weekend'){const end=new Date(day);end.setDate(end.getDate()+(6-end.getDay()));const startD=new Date(end);startD.setDate(end.getDate()-1);list=list.filter(e=>{const d=new Date(e.date+' 23:59:59');return d>=startD&&d<=end})}if(kind==='music')list=list.filter(e=>e.tag.includes('MUSIC')||e.tag.includes('ELECTRONIC'));if(kind==='culture')list=list.filter(e=>e.tag.includes('CULTURE')||e.tag.includes('NAVRATRI'));if(kind==='nightlife')list=list.filter(e=>e.tag.includes('NIGHTLIFE')||e.tag.includes('ELECTRONIC'));document.getElementById('eventsGrid').innerHTML=list.length?eventCards(list):'<div class="emptyGrid"><b>No events in this filter yet.</b><span>Try another category or check upcoming dates.</span></div>'}
function sortEvents(v){let list=[...events];if(v==='date')list.sort((a,b)=>new Date(a.date)-new Date(b.date));if(v==='price')list.sort((a,b)=>a.price-b.price);if(v==='name')list.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('eventsGrid').innerHTML=eventCards(list)}
function toggleSave(id,btn){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];localStorage.setItem('wk_saved',JSON.stringify(state.saved));btn.textContent=state.saved.includes(id)?'♥':'♡';toast(state.saved.includes(id)?'Saved to your events.':'Removed from saved.')} 
function openDetails(id){let e=events.find(x=>x.id===id);const m=document.getElementById('modal');m.className='modal open';m.innerHTML=`<div class="detail"><div class="detailHero"><img src="${posterData(e)}" alt="${esc(e.title)}"><div class="detailTop"><button onclick="closeModal()">←</button><div><button onclick="toggleSave('${e.id}',this)">${state.saved.includes(e.id)?'♥':'♡'}</button></div></div></div><div class="detailContent"><div class="tags"><span class="tag">${e.tag}</span><span class="tag">${e.city}</span></div><h1>${e.title}</h1><div class="detailMeta"><span>${e.date}</span><span>${e.time}</span><span>⌖ ${e.venue}</span></div><p class="sub" style="font-size:17px;margin-top:18px">${e.desc}</p><div class="offerBox"><b>🏷 ${e.offer}</b><span>Offers may have eligibility and minimum-ticket conditions.</span></div><section class="detailSection"><h2>About the event</h2><p>${esc(e.about).replaceAll('\n','<br>')}</p><b>Read more ›</b></section><section class="detailSection"><h2>Things to know</h2><ul>${e.things.map(x=>`<li>${x}</li>`).join('')}</ul><b>View more ›</b></section><div class="stickyBook"><div><small>Tickets</small><b>${money(e.price)} onwards</b></div><button class="primary" onclick="openTickets('${e.id}')">Book tickets</button></div></div></div>`}
function openTickets(id){state.event=events.find(x=>x.id===id);state.cart={};state.step=0;state.payment='';state.upi='';state.card={name:'',number:'',expiry:'',cvv:''};closeModal();openCheckout();renderCheckout()}
function openCheckout(){document.getElementById('modal').className='modal open'}function closeModal(){document.getElementById('modal').className='modal'}
function total(){return state.event.tickets.reduce((s,t)=>s+(state.cart[t[0]]||0)*t[1],0)}
function renderCheckout(){let m=document.getElementById('modal'),e=state.event,body='',d='';if(state.ticket){d=encodeURIComponent(JSON.stringify({v:1,id:state.ticket.id,code:state.ticket.code,eventId:e.id,event:e.title,guest:state.details.name,qty:state.ticket.qty}));}if(state.step===0){body=`<div class="eyebrow">SELECT TICKETS</div><h2>Choose your experience</h2><p class="sub">${e.title} · ${e.date} · ${e.time}</p><div class="ticketList">${e.tickets.map(t=>{let q=state.cart[t[0]]||0;return `<div class="ticketItem"><div class="ticketTop"><div><div class="ticketName">${t[0]}</div><div class="ticketPrice">${money(t[1])}</div></div>${q?`<div class="qty"><button onclick="changeQty('${esc(t[0])}',-1)">−</button><b>${q}</b><button onclick="changeQty('${esc(t[0])}',1)">+</button></div>`:`<button class="addBtn" onclick="changeQty('${esc(t[0])}',1)">Add</button>`}</div><p class="ticketDesc">${t[2]}</p><div class="best">Best for: ${t[3]}</div></div>`}).join('')}</div><div class="summaryBar"><div><small>${Object.values(state.cart).reduce((a,b)=>a+b,0)} ticket(s)</small><b>${money(total())}</b></div><button class="primary" onclick="nextTickets()">Continue</button></div>`}
else if(state.step===1){body=`<div class="eyebrow">YOUR DETAILS</div><h2>Customer details</h2><p class="sub">We'll use these details for your booking confirmation.</p><div class="formGrid"><div class="field full"><label>Full name</label><input id="name" value="${esc(state.details.name)}" placeholder="Your full name"></div><div class="field"><label>Phone number</label><div class="phone"><select id="country"><option>+91</option><option>+1</option><option>+44</option><option>+971</option><option>+65</option><option>+61</option></select><input id="phone" value="${esc(state.details.phone)}" inputmode="tel" placeholder="98765 43210"></div></div><div class="field"><label>Email</label><input id="email" value="${esc(state.details.email)}" type="email" placeholder="you@email.com"></div><div class="field full"><label>Address</label><input id="address" value="${esc(state.details.address)}" placeholder="Address"></div></div><button class="gold" onclick="saveDetails()">Continue to payment</button><button class="back" onclick="state.step=0;renderCheckout()">Back</button>`}
else if(state.step===2){body=`<div class="eyebrow">SECURE CHECKOUT</div><h2>Choose payment</h2><p class="sub">Demo mode — no real money is charged.</p><div class="methods"><button class="method ${state.payment==='upi'?'active':''}" onclick="state.payment='upi';renderCheckout()"><strong>UPI</strong><small>Intent / QR ready for Razorpay production</small></button><button class="method ${state.payment==='card'?'active':''}" onclick="state.payment='card';renderCheckout()"><strong>Cards</strong><small>Credit / Debit</small></button><button class="method ${state.payment==='net'?'active':''}" onclick="state.payment='net';renderCheckout()"><strong>Net Banking</strong><small>Major banks</small></button><button class="method ${state.payment==='wallet'?'active':''}" onclick="state.payment='wallet';renderCheckout()"><strong>Wallets</strong><small>Supported wallets</small></button></div>${state.payment==='upi'?upiBox():''}${state.payment==='card'?cardBox():''}<div class="summaryBar"><div><small>Payable</small><b>${money(total())}</b></div><button class="primary" onclick="startPayment()">Pay ${money(total())}</button></div><p class="note">Production: create Razorpay orders server-side, verify signatures and use webhooks before issuing tickets.</p>`}
else if(state.step===3){body=`<div class="processing"><div class="spinner"></div><h2>Processing your payment</h2><p class="sub">Securing your booking and preparing your ticket…</p></div>`}
else{body=successBody()}
m.innerHTML=`<section class="sheet"><div class="sheetHead"><div><div class="eyebrow">WEKND.SPIRIT</div><h2>${e.title}</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.step<4?`<div style="display:flex;gap:6px;margin:18px 0">${[0,1,2,3].map(i=>`<i style="height:3px;flex:1;border-radius:8px;background:${i<=state.step?'var(--gold)':'#292929'}"></i>`).join('')}</div>`:''}${body}</section>`};if(state.step===4&&window.QRCode){const q=document.getElementById('ticketQr');if(q){q.innerHTML='';new QRCode(q,{text:decodeURIComponent(d),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}}
function changeQty(name,d){state.cart[name]=Math.max(0,Math.min(10,(state.cart[name]||0)+d));if(!state.cart[name])delete state.cart[name];renderCheckout()}
function nextTickets(){if(!total()){toast('Select at least one ticket.');return}state.step=1;renderCheckout()}
function saveDetails(){state.details.name=document.getElementById('name').value.trim();state.details.country=document.getElementById('country').value;state.details.phone=document.getElementById('phone').value.trim();state.details.email=document.getElementById('email').value.trim();state.details.address=document.getElementById('address').value.trim();if(!state.details.name||!state.details.phone||!state.details.email){toast('Please complete name, phone and email.');return}state.step=2;renderCheckout()}
function upiBox(){return `<div style="margin-top:17px"><div class="eyebrow">SELECT UPI APP</div><div class="upiApps"><button class="upiApp ${state.upi==='gpay'?'active':''}" onclick="state.upi='gpay';renderCheckout()"><img class="realIcon" src="https://cdn.simpleicons.org/googlepay" alt="Google Pay">GPay</button><button class="upiApp ${state.upi==='phonepe'?'active':''}" onclick="state.upi='phonepe';renderCheckout()"><img class="realIcon" src="https://cdn.simpleicons.org/phonepe" alt="PhonePe">PhonePe</button><button class="upiApp ${state.upi==='paytm'?'active':''}" onclick="state.upi='paytm';renderCheckout()"><img class="realIcon" src="https://cdn.simpleicons.org/paytm" alt="Paytm">Paytm</button></div></div>`}
function cardBox(){let b=cardBrand(state.card.number);return `<div style="margin-top:16px"><div class="field"><label>Cardholder name</label><input value="${esc(state.card.name)}" oninput="state.card.name=this.value"></div><div class="field"><label>Card number ${b?`<span class="cardBrand"><img src="${b.img}">${b.name}</span>`:''}</label><input inputmode="numeric" maxlength="16" value="${esc(state.card.number)}" oninput="state.card.number=this.value.replace(/\D/g,'').slice(0,16);renderCheckout()" placeholder="4111111111111111"></div><div class="formGrid"><div class="field"><label>Expiry</label><input maxlength="5" value="${esc(state.card.expiry)}" oninput="state.card.expiry=this.value" placeholder="MM/YY"></div><div class="field"><label>CVV</label><input type="password" inputmode="numeric" maxlength="4" value="${esc(state.card.cvv)}" oninput="state.card.cvv=this.value.replace(/\D/g,'')" placeholder="123"></div></div></div>`}
function cardBrand(n){n=n.replace(/\D/g,'');if(/^4/.test(n))return{name:'VISA',img:'https://cdn.simpleicons.org/visa'};if(/^(5[1-5]|2[2-7])/.test(n))return{name:'MASTERCARD',img:'https://cdn.simpleicons.org/mastercard'};if(/^(60|65|81|82|508)/.test(n))return{name:'RUPAY',img:'https://cdn.simpleicons.org/rupay'};return null}
function startPayment(){if(!state.payment){toast('Choose a payment method.');return}if(state.payment==='upi'&&!state.upi){toast('Select GPay, PhonePe or Paytm.');return}if(state.payment==='card'&&(!state.card.name||state.card.number.length<12||!state.card.expiry||state.card.cvv.length<3)){toast('Enter all card details.');return}state.step=3;renderCheckout();setTimeout(()=>{const code='WKND-'+crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase();state.ticket={id:'WKS-'+crypto.randomUUID().replaceAll('-','').slice(0,8).toUpperCase(),code,qty:Object.values(state.cart).reduce((a,b)=>a+b,0),eventId:state.event.id};state.step=4;state.bookings.unshift({...state.ticket,event:state.event.title,date:state.event.date,total:total(),guest:state.details.name});localStorage.setItem('wk_bookings',JSON.stringify(state.bookings));renderCheckout()},1500)}
function successBody(){let e=state.event,d=encodeURIComponent(JSON.stringify({v:1,id:state.ticket.id,code:state.ticket.code,eventId:e.id,event:e.title,guest:state.details.name,qty:state.ticket.qty}));return `<div class="success"><div class="eyebrow">PAYMENT SUCCESSFUL · DEMO</div><h2>Your ticket is ready.</h2><p class="sub">${e.title} · ${e.date} · ${e.time}</p><div class="qr" id="ticketQr"></div><div class="ticketReceipt"><div class="receiptRow"><span>Ticket ID</span><b>${state.ticket.id}</b></div><div class="receiptRow"><span>Entry code</span><b>${state.ticket.code}</b></div><div class="receiptRow"><span>Guest</span><b>${esc(state.details.name)}</b></div><div class="receiptRow"><span>Event</span><b>${esc(e.title)}</b></div><div class="receiptRow"><span>Tickets</span><b>${state.ticket.qty}</b></div><div class="receiptRow"><span>Paid</span><b>${money(total())}</b></div><div class="receiptRow"><span>Status</span><b class="valid">Valid · One-time entry</b></div></div><button class="gold" style="margin-top:14px" onclick="openOrganizer()">Open Organizer Scanner</button><button class="back" onclick="closeModal()">Done</button><p class="note">Scan this QR from another phone using the Organizer Scanner. This demo encodes the ticket data in the QR itself; production check-in should validate the ticket against a server.</p></div>`}
function openOrganizer(){closeAccount();closeModal();document.getElementById('modal').className='modal open';document.getElementById('modal').innerHTML=`<div class="organizer"><div class="sheetHead"><div><div class="eyebrow">ORGANIZER · CHECK-IN</div><h2>Scan tickets</h2><p class="sub">Use this phone as the venue scanner.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="scannerBox"><div id="reader"></div><p class="note">Allow camera access. Point at the customer’s QR ticket from another phone.</p></div><div id="scanResult" class="scanResult"><b>Ready to scan</b><p class="sub">No ticket scanned yet.</p></div></div>`;setTimeout(startScanner,250)}
function startScanner(){if(typeof Html5Qrcode==='undefined'){document.getElementById('scanResult').innerHTML='<b class="invalid">Scanner library is still loading.</b><p class="sub">Refresh once and try Organizer Scanner again.</p>';return}let scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},text=>{scanner.stop().catch(()=>{});handleScan(text)},()=>{}).catch(err=>{document.getElementById('scanResult').innerHTML='<b class="invalid">Camera could not start.</b><p class="sub">Check browser camera permission and try again.</p>'})}
function handleScan(text){let r=document.getElementById('scanResult');try{let data=JSON.parse(decodeURIComponent(text));if(!data.id||!data.code)throw Error();let used=JSON.parse(localStorage.getItem('wk_used')||'[]');if(used.includes(data.id)){r.innerHTML=`<h2 class="invalid">ALREADY USED</h2><p class="sub">Ticket <b>${data.id}</b> has already been checked in.</p><button class="primary" onclick="openOrganizer()">Scan another</button>`;return}r.innerHTML=`<h2 class="valid">✓ VALID TICKET</h2><div class="ticketReceipt"><div class="receiptRow"><span>Ticket</span><b>${data.id}</b></div><div class="receiptRow"><span>Guest</span><b>${esc(data.guest)}</b></div><div class="receiptRow"><span>Event</span><b>${esc(data.event)}</b></div><div class="receiptRow"><span>Quantity</span><b>${data.qty}</b></div></div><button class="gold" style="margin-top:14px" onclick="checkIn('${data.id}')">✓ Check In</button>`;window.pendingScan=data}catch(e){r.innerHTML=`<h2 class="invalid">INVALID QR</h2><p class="sub">This QR is not a WEKND.SPIRIT ticket.</p><button class="primary" onclick="openOrganizer()">Scan again</button>`}}
function checkIn(id){let used=JSON.parse(localStorage.getItem('wk_used')||'[]');if(!used.includes(id))used.push(id);localStorage.setItem('wk_used',JSON.stringify(used));document.getElementById('scanResult').innerHTML=`<h2 class="valid">✓ CHECK-IN COMPLETE</h2><p class="sub">Ticket <b>${id}</b> has been marked as used on this scanner.</p><button class="primary" onclick="openOrganizer()">Scan next ticket</button>`}
function openAccount(){let p=state.profile;document.getElementById('accountDrawer').className='drawer open';document.getElementById('drawerContent').innerHTML=`<div class="drawerhead" style="display:flex;justify-content:space-between"><div><div class="eyebrow">ACCOUNT</div><h2>Manage your WEKND.SPIRIT experience.</h2></div><button class="close" onclick="closeAccount()">×</button></div><div class="profileHero"><div class="profilePic">${p?.photo?`<img src="${p.photo}">`:'<span>YP</span>'}</div><div><div class="profileName">${p?.name||'Guest'}</div><div class="sub">${p?.email||'Sign in to save your details'}</div></div></div>${p?`<div class="drawerItem" onclick="openProfile()"><div><b>My profile</b><small>Edit name, photo & contact details</small></div><span>›</span></div>`:`<div class="drawerItem" onclick="openLogin()"><div><b>Login / Sign up</b><small>Mobile OTP or Email OTP</small></div><span>›</span></div>`}<div class="drawerItem" onclick="showBookings()"><div><b>Your bookings</b><small>Tickets & booking history</small></div><span>›</span></div><div class="drawerItem" onclick="accountMsg('Your address')"><div><b>Your address</b><small>Saved communication address</small></div><span>›</span></div><div class="drawerItem" onclick="accountMsg('Your payments')"><div><b>Your payments</b><small>Payment history & methods</small></div><span>›</span></div><div class="drawerItem" onclick="accountMsg('Support')"><div><b>Support</b><small>Help with bookings</small></div><span>›</span></div><div class="drawerItem" onclick="accountMsg('Notifications')"><div><b>Notifications</b><small>Offers and booking updates</small></div><span>›</span></div><div class="drawerItem" onclick="openOrganizer()"><div><b>Organizer / Check-in</b><small>Scan and validate tickets at the venue</small></div><span>›</span></div><div class="drawerItem" onclick="accountMsg('Settings')"><div><b>Settings</b><small>Preferences & privacy</small></div><span>›</span></div>${p?`<button class="back" onclick="logout()">Log out</button>`:''}`}
function closeAccount(){document.getElementById('accountDrawer').className='drawer'}
function accountMsg(x){toast(x+' — section opened.');closeAccount()}
function openProfile(){closeAccount();document.getElementById('modal').className='modal open';let p=state.profile||{name:'',email:'',phone:'',photo:''};document.getElementById('modal').innerHTML=`<section class="sheet"><div class="sheetHead"><div><div class="eyebrow">PROFILE</div><h2>Your profile</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="profileHero"><div class="profilePic" id="profilePreview">${p.photo?`<img src="${p.photo}">`:'<span>YP</span>'}</div><div><label class="chip" for="photoInput">Change photo</label><input id="photoInput" type="file" accept="image/*" class="hidden" onchange="setPhoto(event)"><p class="note">Your photo is stored locally in this demo.</p></div></div><div class="field"><label>Name</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>Email</label><input id="pemail" value="${esc(p.email)}" type="email"></div><div class="field"><label>Mobile</label><input id="pphone" value="${esc(p.phone)}" inputmode="tel"></div><button class="gold" onclick="saveProfile()">Save profile</button></section>`}
function setPhoto(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{document.getElementById('profilePreview').innerHTML=`<img src="${rd.result}">`;state._photo=rd.result};rd.readAsDataURL(f)}
function saveProfile(){state.profile={name:document.getElementById('pname').value.trim(),email:document.getElementById('pemail').value.trim(),phone:document.getElementById('pphone').value.trim(),photo:state._photo||state.profile?.photo||''};localStorage.setItem('wk_profile',JSON.stringify(state.profile));state._photo=null;closeModal();toast('Profile saved.');renderHome()}
function openLogin(){closeAccount();document.getElementById('modal').className='modal open';document.getElementById('modal').innerHTML=`<section class="sheet"><div class="sheetHead"><div><div class="eyebrow">ACCOUNT ACCESS</div><h2>Welcome back</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="loginCard"><div class="loginTabs"><button class="tab active" id="mobTab" onclick="loginMode('mobile')">Mobile OTP</button><button class="tab" id="mailTab" onclick="loginMode('email')">Email OTP</button></div><div class="field" style="margin-top:20px"><label id="loginLabel">Mobile number</label><div id="loginField"><div class="phone"><select><option>+91</option><option>+1</option><option>+44</option><option>+971</option></select><input id="loginValue" inputmode="tel" placeholder="98765 43210"></div></div></div><button class="gold" onclick="sendOtp()">Send OTP</button><p class="note" id="otpNote">Demo OTP flow — real OTP provider required for production.</p></div></section>`}
let loginType='mobile';function loginMode(t){loginType=t;document.getElementById('mobTab').classList.toggle('active',t==='mobile');document.getElementById('mailTab').classList.toggle('active',t==='email');document.getElementById('loginLabel').textContent=t==='mobile'?'Mobile number':'Email address';document.getElementById('loginField').innerHTML=t==='mobile'?`<div class="phone"><select><option>+91</option><option>+1</option><option>+44</option><option>+971</option></select><input id="loginValue" inputmode="tel" placeholder="98765 43210"></div>`:`<input id="loginValue" type="email" placeholder="you@email.com">`}
function sendOtp(){let v=document.getElementById('loginValue').value.trim();if(!v){toast('Enter your '+(loginType==='mobile'?'mobile number':'email address'));return}document.querySelector('.loginCard').innerHTML=`<div class="eyebrow">OTP VERIFICATION</div><h2>Enter the OTP</h2><p class="sub">A verification code was sent to ${esc(v)}.</p><div class="field"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div><button class="gold" onclick="verifyOtp('${esc(v)}')">Verify & continue</button><p class="note">Demo OTP: 123456. Production must use a real OTP provider.</p>`}
function verifyOtp(v){let code=document.getElementById('otp').value.trim();if(code!=='123456'){toast('Use demo OTP 123456.');return}state.profile=state.profile||{name:'',email:'',phone:'',photo:''};if(loginType==='email')state.profile.email=v;else state.profile.phone=v;localStorage.setItem('wk_profile',JSON.stringify(state.profile));closeModal();toast('Login successful.');renderHome()}
function showBookings(){closeAccount();document.getElementById('modal').className='modal open';document.getElementById('modal').innerHTML=`<section class="sheet"><div class="sheetHead"><div><div class="eyebrow">ACCOUNT</div><h2>Your bookings</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.bookings.length?state.bookings.map(b=>`<div class="ticketReceipt" style="margin:12px 0"><div class="receiptRow"><span>Event</span><b>${esc(b.event)}</b></div><div class="receiptRow"><span>Date</span><b>${b.date}</b></div><div class="receiptRow"><span>Ticket</span><b>${b.id}</b></div><div class="receiptRow"><span>Total</span><b>${money(b.total)}</b></div></div>`).join(''):'<p class="empty">No bookings yet.</p>'}</section>`}
function logout(){state.profile=null;localStorage.removeItem('wk_profile');closeAccount();renderHome();toast('Logged out.')}
function openSearch(){const m=document.getElementById('modal');m.className='modal open';m.innerHTML=`<section class="sheet searchSheet"><div class="sheetHead"><div><div class="eyebrow">DISCOVER</div><h2>Search experiences</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><input id="searchInput" autofocus placeholder="Search music, Garba, nightlife…" oninput="runSearch(this.value)"></div><div id="searchResults">${searchResults('')}</div></section>`;setTimeout(()=>document.getElementById('searchInput')?.focus(),80)}
function searchResults(q){q=(q||'').trim().toLowerCase();let list=q?events.filter(e=>(e.title+' '+e.tag+' '+e.city+' '+e.venue).toLowerCase().includes(q)):events.slice(0,5);return list.length?`<div class="searchList">${list.map(e=>`<button class="searchResult" onclick="closeModal();openDetails('${e.id}')"><img src="${posterData(e,true)}"><span><b>${esc(e.title)}</b><small>${e.date} · ${e.city}</small></span><strong>›</strong></button>`).join('')}</div>`:'<p class="empty">No experiences found.</p>'}
function runSearch(q){let el=document.getElementById('searchResults');if(el)el.innerHTML=searchResults(q)}
function useLocation(){if(!navigator.geolocation){toast('Location unavailable — choose Vadodara.');return}navigator.geolocation.getCurrentPosition(()=>{selectCity('Vadodara')},()=>toast('Location permission denied — choose your city manually.'))}
function selectCity(c){state.city=c;renderHome()};function home(){if(state.city)renderHome();else renderGate()}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.cssText='display:block;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:12px 16px;border-radius:999px;font-size:12px;font-weight:900;z-index:200';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2200)}
function renderGate(){document.getElementById('app').innerHTML='';renderGate0()}function renderGate0(){document.getElementById('app').innerHTML=`<main class="wrap gate"><section class="gatebox"><div class="eyebrow">WEKND.SPIRIT · YOUR ACCESS TO EXTRAORDINARY EXPERIENCES</div><h1>Where's your<br>weekend?</h1><p class="sub">Choose your city to discover curated events, experiences and the weekends worth remembering.</p><div class="cities"><button class="city" onclick="selectCity('Vadodara')"><b>Vadodara</b><small>Gujarat · curated weekends</small></button><button class="city" onclick="toast('Ahmedabad is coming soon.')"><b>Ahmedabad</b><small>Coming soon</small></button><button class="city" onclick="toast('Mumbai is coming soon.')"><b>Mumbai</b><small>Coming soon</small></button><button class="city" onclick="toast('More cities coming soon.')"><b>More cities</b><small>Coming soon</small></button></div><button class="loc" onclick="useLocation()">⌖ Use your current location</button><p class="note" style="margin-top:13px">Location is used only to set your event city in this demo.</p></section></main>`}
renderGate0();
</script>
</body></html>
