<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WEKND.SPIRIT — Premium Events</title><meta name="theme-color" content="#090909"><style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--text:#f6f3ec;--muted:#9d9a92;--gold:#d9b86c;--line:#292929;--ok:#62d29b;--danger:#ff7676}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#27200f 0,#080808 34%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;background:rgba(8,8,8,.9);backdrop-filter:blur(16px);z-index:20}.logo{font-weight:900;letter-spacing:.13em}.nav{display:flex;gap:24px;color:#bbb;font-size:13px}.nav span{cursor:pointer}.avatar{width:38px;height:38px;border:1px solid #3a3a3a;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:54px 5vw 90px}.gate{min-height:calc(100vh - 70px);display:grid;place-items:center}.gatebox{width:min(650px,100%);padding:44px 0}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800}.gate h1{font-size:clamp(40px,8vw,72px);line-height:.98;margin:14px 0}.sub{color:var(--muted);line-height:1.7}.cities{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:30px 0 16px}.city{padding:20px;border:1px solid var(--line);border-radius:16px;background:#101010;text-align:left;color:var(--text)}.city:hover{border-color:#5b4c2b}.city b{display:block}.city small{color:var(--muted)}.loc{width:100%;padding:17px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:13px;font-weight:800}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}.header h1{font-size:clamp(34px,5vw,58px);margin:8px 0}.pill{border:1px solid #383838;border-radius:999px;padding:9px 13px;color:#bbb;font-size:12px}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.event{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#101010;transition:.2s}.event:hover{transform:translateY(-3px);border-color:#4a4a4a}.poster{height:270px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.poster:after{content:"";position:absolute;inset:auto -20% -60px auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}.p1{background:linear-gradient(135deg,#5b1717,#1d0e0e 55%,#c49b4a)}.p2{background:linear-gradient(135deg,#18112b,#44215e 55%,#d9b86c)}.p3{background:linear-gradient(135deg,#10382e,#15251e 55%,#b6d18c)}.p4{background:linear-gradient(135deg,#091725,#17284b 55%,#9a68ff)}.p5{background:linear-gradient(135deg,#5a191d,#d06b21 55%,#f0d46a)}.poster .tag{position:relative;z-index:2;display:inline-flex;width:max-content;padding:7px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.22);font-size:10px;letter-spacing:.12em}.poster h2{position:relative;z-index:2;font-size:36px;max-width:85%;margin:0;line-height:1}.info{padding:20px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 15px}.meta span{font-size:12px;color:#bbb;background:#191919;border:1px solid #292929;padding:7px 9px;border-radius:999px}.info p{color:var(--muted);margin:0 0 18px;line-height:1.5}.btn{border:0;background:var(--text);color:#111;border-radius:11px;padding:13px 16px;font-weight:900}.ghost{border:1px solid #363636;background:transparent;color:#ddd;border-radius:11px;padding:12px 15px;font-weight:800}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:none}.drawer.open{display:block}.drawerbox{position:absolute;right:0;top:0;height:100%;width:min(390px,92vw);background:#101010;border-left:1px solid #303030;padding:26px;box-shadow:-20px 0 60px rgba(0,0,0,.45)}.drawerhead{display:flex;justify-content:space-between;align-items:center}.draweritem{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #242424;color:#ddd}.draweritem span{color:#777}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:30;display:none;overflow:auto;padding:30px 16px}.modal.open{display:block}.sheet{max-width:760px;margin:auto;background:#101010;border:1px solid #303030;border-radius:24px;padding:28px}.sheethead{display:flex;justify-content:space-between;gap:20px}.close{background:#1a1a1a;border:1px solid #333;color:#bbb;border-radius:50%;width:38px;height:38px}.stepbar{display:flex;gap:7px;margin:22px 0}.stepbar i{height:3px;flex:1;background:#292929;border-radius:9px}.stepbar i.on{background:var(--gold)}.tickets{display:grid;gap:10px}.ticket{display:flex;justify-content:space-between;align-items:center;border:1px solid #292929;background:#141414;padding:17px;border-radius:15px}.ticket.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.ticket small{display:block;color:#888;margin-top:4px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:31px;height:31px;border-radius:9px;border:1px solid #3a3a3a;background:#1d1d1d;color:white}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin:12px 0}.field.full{grid-column:1/-1}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border-radius:11px;border:1px solid #343434;background:#151515;color:#eee;outline:none}.phone{display:grid;grid-template-columns:120px 1fr;gap:8px}.summary{border-top:1px solid #292929;margin-top:22px;padding-top:18px}.row{display:flex;justify-content:space-between;margin:8px 0;color:#aaa}.row b{color:#fff}.next{width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:900}.back{width:100%;margin-top:10px;padding:13px;border:1px solid #333;border-radius:12px;background:transparent;color:#bbb}.methodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.method{padding:17px;border:1px solid #2d2d2d;border-radius:15px;background:#141414;text-align:left}.method.selected{border-color:var(--gold)}.method strong{display:block}.method small{color:#888}.upiapps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.upibtn{padding:15px 8px;border:1px solid #2c2c2c;background:#151515;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}.upibtn.selected{border-color:var(--gold)}.brand{height:23px;width:38px;object-fit:contain;background:#fff;border-radius:4px;padding:2px;vertical-align:middle}.note{font-size:11px;color:#777;line-height:1.5}.processing{text-align:center;padding:55px 10px}.spinner{width:48px;height:48px;border:3px solid #333;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px}@keyframes spin{to{transform:rotate(360deg)}}.success{text-align:center}.qr{background:white;padding:14px;border-radius:15px;width:220px;margin:20px auto}.qr img{display:block;width:100%}.ticketcard{border:1px solid #333;border-radius:18px;padding:18px;text-align:left;background:#131313}.scan{margin-top:12px;border:1px dashed #4a4a4a;border-radius:12px;padding:13px;color:#aaa;font-size:12px}.ok{color:var(--ok);font-weight:800}.empty{color:#777;padding:30px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:12px 16px;border-radius:999px;font-size:12px;font-weight:800;z-index:60;display:none}@media(max-width:720px){.nav{display:none}.events{grid-template-columns:1fr}.cities{grid-template-columns:1fr}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.methodgrid{grid-template-columns:1fr}.upiapps{grid-template-columns:1fr}.poster{height:235px}.wrap{padding-top:35px}.sheet{padding:21px}.top{padding:0 18px}}
</style></head><body><div class="app" id="app"></div><div class="drawer" id="drawer"><aside class="drawerbox"><div class="drawerhead"><h2>Account</h2><button class="close" onclick="closeAccount()">×</button></div><div class="sub" style="margin:4px 0 20px">Manage your WEKND.SPIRIT experience.</div><div class="draweritem" onclick="accountMsg('Your bookings')">Your bookings <span>›</span></div><div class="draweritem" onclick="accountMsg('Your address')">Your address <span>›</span></div><div class="draweritem" onclick="accountMsg('Your payments')">Your payments <span>›</span></div><div class="draweritem" onclick="accountMsg('Support')">Support <span>›</span></div><div class="draweritem" onclick="accountMsg('Notifications')">Notifications <span>›</span></div><div class="draweritem" onclick="accountMsg('Settings')">Settings <span>›</span></div></aside></div><div class="modal" id="modal"></div><div class="toast" id="toast"></div><script>
const events=[
{id:1,title:'Kum-Kum Pagla',date:'27 Sep 2026',time:'7:00 PM',city:'Vadodara, Gujarat',venue:'Venue disclosed after booking',tag:'CULTURE · HERITAGE',poster:'p1',desc:'An intimate cultural evening rooted in Vadodara’s heritage, music and stories.',tickets:[['Early Bird',499],['General Access',799],['Couple Pass',1399],['Group Pass (4)',2499],['VIP',3499],['VVIP',4999],['Table / Lounge (8)',9999]]},
{id:2,title:'Sufi After Dark',date:'10 Oct 2026',time:'8:30 PM',city:'Vadodara, Gujarat',venue:'Venue disclosed after booking',tag:'MUSIC · LIVE',poster:'p2',desc:'Soulful Sufi performances, premium ambience and a late-night city mood.',tickets:[['Early Access',699],['General Access',999],['Couple Pass',1799],['VIP',3999],['VVIP',5999]]},
{id:3,title:'The Vadodara Social',date:'24 Oct 2026',time:'7:30 PM',city:'Vadodara, Gujarat',venue:'Venue disclosed after booking',tag:'PEOPLE · COMMUNITY',poster:'p3',desc:'A curated social night for conversations, connections and good energy.',tickets:[['General Access',599],['Couple Pass',1099],['Group Pass (4)',1999],['VIP',2999]]},
{id:4,title:'Midnight Frequencies',date:'31 Oct 2026',time:'10:00 PM',city:'Vadodara, Gujarat',venue:'Venue disclosed after booking',tag:'ELECTRONIC · NIGHTLIFE',poster:'p4',desc:'A darker, louder Halloween night built around electronic frequencies.',tickets:[['Early Bird',799],['General Access',1199],['Couple Pass',1999],['VIP',4499],['Table / Lounge (8)',11999]]},
{id:5,title:'Rang — Festival of Colours',date:'14 Nov 2026',time:'5:00 PM',city:'Vadodara, Gujarat',venue:'Venue disclosed after booking',tag:'CULTURE · FESTIVAL',poster:'p5',desc:'A high-energy celebration of colour, music, food and weekend spirit.',tickets:[['Early Bird',399],['General Access',699],['Couple Pass',1199],['Group Pass (4)',2199],['VIP',2999]]}
];
let state={city:null,event:null,step:0,cart:{},details:{country:'+91',phone:'',name:'',email:'',address:''},payment:'',upi:'',card:{number:'',expiry:'',cvv:'',name:''},ticket:null,scanned:false};
const money=n=>'₹'+n.toLocaleString('en-IN');
function render(){const a=document.getElementById('app');if(!state.city){a.innerHTML=`<header class="top"><div class="logo">WEKND.SPIRIT</div><div class="avatar" onclick="openAccount()">YP</div></header><main class="wrap gate"><section class="gatebox"><div class="eyebrow">THE WEEKEND, CURATED</div><h1>Where’s your<br>weekend headed?</h1><p class="sub">Select your city to discover curated events, premium experiences and unforgettable nights.</p><div class="cities"><button class="city" onclick="selectCity('Vadodara')"><b>Vadodara</b><small>Gujarat · 5 events</small></button><button class="city" onclick="selectCity('Mumbai')"><b>Mumbai</b><small>Maharashtra · Coming soon</small></button><button class="city" onclick="selectCity('Ahmedabad')"><b>Ahmedabad</b><small>Gujarat · Coming soon</small></button><button class="city" onclick="selectCity('Delhi')"><b>Delhi NCR</b><small>Coming soon</small></button></div><button class="loc" onclick="useLocation()">⌖ Use your current location</button><p class="note" style="margin-top:12px">Location is used only to suggest your nearest city. Demo site — no payment is collected.</p></section></main>`;return}a.innerHTML=`<header class="top"><div class="logo">WEKND.SPIRIT</div><nav class="nav"><span onclick="scrollTo(0,0)">Events</span><span onclick="accountMsg('About WEKND.SPIRIT')">About</span><span onclick="accountMsg('Contact')">Contact</span></nav><div class="avatar" onclick="openAccount()">YP</div></header><main class="wrap"><div class="header"><div><div class="eyebrow">${state.city.toUpperCase()}, INDIA</div><h1>Discover your weekend.</h1><div class="sub">Curated. Premium. Unforgettable.</div></div><div class="pill">📍 ${state.city} · Change city</div></div><div class="events">${events.map(e=>`<article class="event"><div class="poster ${e.poster}"><span class="tag">${e.tag}</span><h2>${e.title}</h2></div><div class="info"><div class="meta"><span>${e.date}</span><span>${e.time}</span><span>${e.city}</span></div><p>${e.desc}</p><button class="btn" onclick="openEvent(${e.id})">View event & tickets →</button></div></article>`).join('')}</div></main>`}
function selectCity(c){if(c!=='Vadodara'){toast('More cities are coming soon.');return}state.city=c;render()}
function useLocation(){if(!navigator.geolocation){toast('Location is unavailable — choose Vadodara.');return}navigator.geolocation.getCurrentPosition(()=>{state.city='Vadodara';render()},()=>toast('Could not access location — choose your city manually.'))}
function openAccount(){document.getElementById('drawer').classList.add('open')}function closeAccount(){document.getElementById('drawer').classList.remove('open')}function accountMsg(x){closeAccount();toast(x+' — demo section ready.')}function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}
function openEvent(id){state.event=events.find(e=>e.id===id);state.cart={};state.step=0;state.payment='';state.upi='';openModal();renderFlow()}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function total(){return state.event.tickets.reduce((s,t)=>s+(state.cart[t[0]]||0)*t[1],0)}
function renderFlow(){const m=document.getElementById('modal');const e=state.event;let body='';if(state.step===0){body=`<h2>Select tickets</h2><p class="sub">${e.title} · ${e.date} · ${e.time}</p><div class="tickets">${e.tickets.map(t=>{let q=state.cart[t[0]]||0;return `<div class="ticket ${q?'selected':''}"><div><b>${t[0]}</b><small>${money(t[1])} per person/pass</small></div><div class="qty"><button onclick="changeQty('${t[0]}',-1)">−</button><b>${q}</b><button onclick="changeQty('${t[0]}',1)">+</button></div></div>`}).join('')}</div><div class="summary"><div class="row"><span>Total</span><b>${money(total())}</b></div></div><button class="next" onclick="nextFromTickets()">Continue →</button>`}
else if(state.step===1){body=`<h2>Customer details</h2><p class="sub">These details will appear on your ticket confirmation.</p><div class="fieldgrid"><div class="field full"><label>Full name</label><input id="name" value="${esc(state.details.name)}" placeholder="Your name"></div><div class="field"><label>Phone number</label><div class="phone"><select id="country"><option>+91</option><option>+1</option><option>+44</option><option>+971</option><option>+65</option><option>+61</option></select><input id="phone" value="${esc(state.details.phone)}" inputmode="tel" placeholder="98765 43210"></div></div><div class="field"><label>Email</label><input id="email" value="${esc(state.details.email)}" type="email" placeholder="you@email.com"></div><div class="field full"><label>Address</label><input id="address" value="${esc(state.details.address)}" placeholder="Billing / communication address"></div></div><button class="next" onclick="saveDetails()">Continue to payment →</button><button class="back" onclick="state.step=0;renderFlow()">Back</button>`}
else if(state.step===2){body=`<h2>Choose payment</h2><p class="sub">Demo checkout — no real money is charged.</p><div class="methodgrid"><button class="method ${state.payment==='upi'?'selected':''}" onclick="state.payment='upi';renderFlow()"><strong>UPI</strong><small>GPay · PhonePe · Paytm</small></button><button class="method ${state.payment==='card'?'selected':''}" onclick="state.payment='card';renderFlow()"><strong>Cards</strong><small>Credit / Debit card</small></button><button class="method ${state.payment==='net'?'selected':''}" onclick="state.payment='net';renderFlow()"><strong>Net Banking</strong><small>Major Indian banks</small></button><button class="method ${state.payment==='wallet'?'selected':''}" onclick="state.payment='wallet';renderFlow()"><strong>Wallets</strong><small>Supported wallets</small></button></div>${state.payment==='upi'?upiBox():''}${state.payment==='card'?cardBox():''}<div class="summary"><div class="row"><span>Payable</span><b>${money(total())}</b></div></div><button class="next" onclick="startPayment()">Pay ${money(total())} →</button><button class="back" onclick="state.step=1;renderFlow()">Back</button><p class="note">For production, connect this UI to a server-created Razorpay order and verify the payment signature/webhook before issuing a ticket.</p>`}
else if(state.step===3){body=`<div class="processing"><div class="spinner"></div><h2>Processing your payment</h2><p class="sub">Securing your booking and generating your ticket…</p></div>`}
else{body=`<div class="success"><div class="eyebrow">PAYMENT SUCCESSFUL</div><h2>Your ticket is ready.</h2><p class="sub">${e.title} · ${e.date} · ${e.time}</p><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(state.ticket.code)}" alt="Ticket QR code"></div><div class="ticketcard"><div class="row"><span>Ticket ID</span><b>${state.ticket.id}</b></div><div class="row"><span>Entry code</span><b>${state.ticket.code}</b></div><div class="row"><span>Guest</span><b>${state.details.name}</b></div><div class="row"><span>Phone</span><b>${state.details.country} ${state.details.phone}</b></div><div class="row"><span>Tickets</span><b>${state.ticket.qty}</b></div><div class="row"><span>Paid</span><b>${money(total())}</b></div><div class="scan">QR status: <span class="ok">Valid · One-time entry</span></div></div><button class="next" onclick="simulateScan()">Organizer: Scan QR (demo)</button><button class="back" onclick="closeModal()">Done</button><p class="note">This demo QR is generated from the ticket code. A production ticket should be generated only after server-side payment verification.</p></div>`}m.innerHTML=`<section class="sheet"><div class="sheethead"><div><div class="eyebrow">WEKND.SPIRIT CHECKOUT</div><h2 style="margin:7px 0 0">${e.title}</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.step<4?`<div class="stepbar">${[0,1,2,3].map(i=>`<i class="${i<=state.step?'on':''}"></i>`).join('')}</div>`:''}${body}</section>`}
function changeQty(name,d){state.cart[name]=Math.max(0,Math.min(10,(state.cart[name]||0)+d));if(!state.cart[name])delete state.cart[name];renderFlow()}
function nextFromTickets(){if(!total()){toast('Select at least one ticket.');return}state.step=1;renderFlow()}
function saveDetails(){state.details.name=document.getElementById('name').value.trim();state.details.country=document.getElementById('country').value;state.details.phone=document.getElementById('phone').value.trim();state.details.email=document.getElementById('email').value.trim();state.details.address=document.getElementById('address').value.trim();if(!state.details.name||!state.details.phone||!state.details.email){toast('Please complete name, phone and email.');return}state.step=2;renderFlow()}
function upiBox(){return `<div style="margin-top:16px"><div class="eyebrow">SELECT UPI APP</div><div class="upiapps"><button class="upibtn ${state.upi==='gpay'?'selected':''}" onclick="state.upi='gpay';renderFlow()"><img class="brand" src="https://cdn.simpleicons.org/googlepay" alt="Google Pay">GPay</button><button class="upibtn ${state.upi==='phonepe'?'selected':''}" onclick="state.upi='phonepe';renderFlow()"><img class="brand" src="https://cdn.simpleicons.org/phonepe" alt="PhonePe">PhonePe</button><button class="upibtn ${state.upi==='paytm'?'selected':''}" onclick="state.upi='paytm';renderFlow()"><img class="brand" src="https://cdn.simpleicons.org/paytm" alt="Paytm">Paytm</button></div></div>`}
function cardBox(){const brand=cardBrand(state.card.number);return `<div style="margin-top:16px"><div class="field"><label>Cardholder name</label><input value="${esc(state.card.name)}" oninput="state.card.name=this.value"></div><div class="field"><label>Card number ${brand?`<img class="brand" src="${brand.img}" alt="${brand.name}"> <b>${brand.name}</b>`:''}</label><input inputmode="numeric" maxlength="19" value="${esc(state.card.number)}" oninput="state.card.number=this.value.replace(/[^0-9]/g,'').slice(0,16);renderFlow();this.focus()" placeholder="4111 1111 1111 1111"></div><div class="fieldgrid"><div class="field"><label>Expiry</label><input maxlength="5" value="${esc(state.card.expiry)}" oninput="state.card.expiry=this.value" placeholder="MM/YY"></div><div class="field"><label>CVV</label><input type="password" inputmode="numeric" maxlength="4" value="${esc(state.card.cvv)}" oninput="state.card.cvv=this.value.replace(/[^0-9]/g,'')" placeholder="123"></div></div></div>`}
function cardBrand(n){n=n.replace(/\D/g,'');if(/^4/.test(n))return{name:'VISA',img:'https://cdn.simpleicons.org/visa'};if(/^(5[1-5]|2[2-7])/.test(n))return{name:'MASTERCARD',img:'https://cdn.simpleicons.org/mastercard'};if(/^(60|65|81|82|508)/.test(n))return{name:'RUPAY',img:'https://cdn.simpleicons.org/rupay'};return null}
function startPayment(){if(!state.payment){toast('Choose a payment method.');return}if(state.payment==='upi'&&!state.upi){toast('Select GPay, PhonePe or Paytm.');return}if(state.payment==='card'&&(!state.card.name||state.card.number.length<12||!state.card.expiry||state.card.cvv.length<3)){toast('Enter all card details.');return}state.step=3;renderFlow();setTimeout(()=>{state.ticket={id:'WKS-'+Math.random().toString(36).slice(2,8).toUpperCase(),code:'WKND-'+Math.random().toString(36).slice(2,10).toUpperCase(),qty:Object.values(state.cart).reduce((a,b)=>a+b,0)};state.step=4;renderFlow()},1800)}
function simulateScan(){if(state.scanned){toast('This ticket has already been scanned.');return}state.scanned=true;document.querySelector('.scan').innerHTML='QR status: <span class="ok">✓ Entry verified · Ticket marked used</span>'}
function esc(x){return String(x||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
render();
</script></body></html>
